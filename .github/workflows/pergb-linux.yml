# Pay-per-GB v2 — the Linux-only checks of the node side (netns, nft,
# systemd, Docker builds, haproxy). Jobs of lane L2 (per-GB runtime) are
# prefixed l2-.
name: pergb-linux

on:
  push:
    branches: ["feat/pergb2-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l2-3proxy-pergb:
    name: "L2: 3proxy-pergb build (reproducible) + RSS smoke"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build in Docker (pinned tarball, image, apt snapshot)
        run: bash scripts/build_3proxy_pergb.sh --out "$RUNNER_TEMP/build"
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: 3proxy-pergb
          path: ${{ runner.temp }}/build
      - name: Patch, pinned hash = rebuild, golden cfg parses, 100k-login RSS smoke (netns)
        run: sudo bash scripts/test_build_3proxy_pergb.sh --require-all --rebuilt "$RUNNER_TEMP/build"
