# Pay-per-GB v2 — the Linux-only checks of the node side (netns, nft,
# systemd, Docker builds, haproxy). Jobs are prefixed with their lane:
# l1- (netrun-radius), l2- (per-GB runtime), l3- (node agent per-GB), l9- (node shields).
#
# 2026-10-14 (owner: «облегчить CI»): every suite runs ONCE, on what the nodes
# run (Ubuntu 24.04: node 20, python 3.12) — the agent suite ran five times
# (node 20 + 22, three jobs) and the RADIUS units twice (3.10 + 3.12); the
# 3proxy-pergb Docker build (6-25 min: snapshot.ubuntu.com) is cached by the
# hash of the patch and the build script, so it only rebuilds when they
# change (the reproducible check still compares the committed binary with that
# build); a newer run of the same ref cancels the older one.
name: pergb-linux

on:
  push:
    branches: ["feat/pergb2", "feat/pergb2-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pergb-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l1-radius-unit:
    name: "L1: netrun-radius unit tests (python 3.12, the nodes' Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unittest (codec, grammar, tag, allocator, state, ctl, socket activation, READY, load, e2e dry run)
        env:
          NETRUN_RADIUS_PERF_SLACK: "2"
        run: python -I -m unittest discover -s node_runtime/radius/tests -v

  l1-radius-systemd:
    name: "L1: netrun-radius units under a real systemd"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning scripts/test_pergb_radius_e2e.sh scripts/test_netrun_radius_units.sh
      - name: verify, socket activation, READY, restarts under load, crash loop, watchdog, corrupt DB
        env:
          NETRUN_RADIUS_PERF_SLACK: "2"
        run: sudo --preserve-env=NETRUN_RADIUS_PERF_SLACK bash scripts/test_netrun_radius_units.sh --throwaway-host

  l1-radius-e2e:
    name: "L1: netrun-radius + 3proxy end to end (network namespace)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: e2e (3proxy-pergb when present, else the stock 0.9.3 binary)
        run: sudo bash scripts/test_pergb_radius_e2e.sh --out "$RUNNER_TEMP/e2e"
      - name: Upload results and captured Access-Requests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-radius-e2e
          path: ${{ runner.temp }}/e2e

  l2-3proxy-pergb-build:
    name: "L2: build 3proxy-pergb (pinned tarball, image, apt snapshot)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # the same patch + build script = the same binary (that is what the
      # reproducible check proves): build once per change, not per run
      - name: The build of this patch, if one was cached
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/build
          key: 3proxy-pergb-${{ hashFiles('deploy/node/3proxy-pergb/netrun-pergb.patch', 'scripts/build_3proxy_pergb.sh') }}
      - name: Build in Docker
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build_3proxy_pergb.sh --out "$RUNNER_TEMP/build"
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: 3proxy-pergb
          path: ${{ runner.temp }}/build

  l2-3proxy-pergb-test:
    name: "L2: 3proxy-pergb reproducible + golden cfg + 100k-login RSS smoke (netns)"
    needs: l2-3proxy-pergb-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 3proxy-pergb
          path: ${{ runner.temp }}/build
      - name: Patch applies, committed binary = pin = rebuild, golden parses, RSS flat vs stock growth
        run: sudo bash scripts/test_build_3proxy_pergb.sh --require-all --rebuilt "$RUNNER_TEMP/build"

  l2-guard:
    name: "L2: netrun-proxy-guard (two uids; kernel section in a netns)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      - name: The per-GB user, so nft may print its name (the guard must still pass)
        run: sudo groupadd --system -g 65533 netrun-pergb && sudo useradd --system -u 65533 -g 65533 -M -s /usr/sbin/nologin netrun-pergb
      - name: Guard tests (the kernel section must run)
        run: |
          sudo bash scripts/test_netrun_proxy_guard.sh | tee "$RUNNER_TEMP/guard.out"
          ! grep -q '^skip: kernel' "$RUNNER_TEMP/guard.out"

  l2-haproxy:
    name: "L2: per-GB haproxy golden (haproxy -c + live routing in a netns)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq haproxy && (sudo systemctl stop haproxy || true)
      - name: shellcheck
        run: shellcheck -S warning scripts/test_pergb_haproxy.sh
      - name: haproxy -c, live routing (TLS / SOCKS5 / plain HTTP / rejects), e2e through the committed 3proxy-pergb
        run: sudo env "PATH=$PATH" bash scripts/test_pergb_haproxy.sh --require-all

  l2-install:
    name: "L2: install_pergb.sh (idempotent on a real node, systemd-analyze verify, container refusals)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # the committed binary (deploy/node/bin/3proxy-pergb) — no need to wait for the build
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq haproxy rsyslog && (sudo systemctl stop haproxy || true)
      - name: Stubbed installer tests
        run: bash scripts/test_install_pergb.sh
      - name: Certificate reload script (stubbed systemctl/haproxy) + shellcheck
        run: |
          shellcheck -S warning scripts/test_pergb_certs_reload.sh deploy/node/netrun-pergb-certs-reload.sh
          bash scripts/test_pergb_certs_reload.sh
      - name: Real installer on this runner, twice
        run: sudo bash scripts/test_install_pergb.sh --real

  l2-scripts:
    name: "L2: capacity tuning (--conntrack, maxmap, per-GB listener audit) and the touched script suites"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning scripts/apply_capacity_tuning.sh scripts/test_apply_capacity_tuning.sh
      - run: bash scripts/test_apply_capacity_tuning.sh
      - run: bash scripts/test_3proxy_spawn.sh
      - run: bash scripts/test_capacity_18k_node.sh
      - run: bash scripts/test_fleet_health_node.sh
      - name: BGP apply (stubbed) — the bird drop-in restarts BIRD whatever the exit
        run: bash scripts/test_netrun_bgp.sh
      - name: HQ watch (stubbed curl/timeout) + shellcheck
        run: |
          shellcheck -S warning deploy/node/netrun-hq-watch.sh scripts/test_hq_watch.sh scripts/test_hq_watch_install.sh
          bash scripts/test_hq_watch.sh
          bash scripts/test_hq_watch_install.sh
      - name: quick-install registers over https only (audit S-U2) + shellcheck
        run: |
          shellcheck -S warning scripts/test_quick_install_https.sh
          bash scripts/test_quick_install_https.sh

  # Lane L9 — node shields: the A1 address pool (generator, egress.js,
  # deprovision), option A / B shields (accounting, firewall, deprovision,
  # netrun-https), /health clock, /describe capacity, the :8086 agent guard.
  l9-node-shields:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tools (nftables, haproxy, openssl)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nftables haproxy openssl iproute2 >/dev/null
          nft --version; haproxy -v | head -n1; node --version; python3 --version
      - name: Generator, harden and HTTPS scripts (bash, stubs)
        run: |
          bash scripts/test_generator_flags.sh
          bash node_runtime/soft/generator/test_routed_prefix.sh
          bash scripts/test_netrun_harden_security.sh
          bash scripts/test_https_hostnames.sh
      - name: Per-GB nft shields against the real kernel (private netns)
        run: sudo env "PATH=$PATH" unshare -n bash scripts/test_pergb_nft_shield.sh

  # the ONE run of the whole agent suite (node 20, as on the nodes)
  l3-agent-pergb:
    name: "L3: node agent (the whole suite; per-GB meter, enforcer, kills, guards, smart rotation, TLS :8086, e2e against the real netrun-radius)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: per-GB agent suites (python3 + openssl present, so nothing may skip)
        run: |
          node --test node_runtime/node_agent/pergb_*.test.js node_runtime/node_agent/server.pergb.test.js | tee "$RUNNER_TEMP/l3.out"
          grep -qE '^(ℹ|#) skipped 0$' "$RUNNER_TEMP/l3.out"   # spec (TTY / node ≥23) or TAP (piped node 20/22)
      - name: the whole agent suite
        run: node --test node_runtime/node_agent/*.test.js

  l3-agent-linux:
    name: "L3: per-GB sockets and kills on a real kernel (ss cgroup filter, ss -K by 4-tuple, V11)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: shellcheck
        run: shellcheck -S warning scripts/test_pergb_agent_linux.sh
      - name: ss listing / kills by cgroup and by address
        run: sudo env "PATH=$PATH" bash scripts/test_pergb_agent_linux.sh --throwaway-host
