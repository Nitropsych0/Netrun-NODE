# NETRUN — the TCP/IP signature of every packet this node sends (audit FP-01).
# The ONE place the node's TCP stack is set: installed as
# /etc/sysctl.d/99-zz-netrun-tcp.conf by install_node_v2.sh, node_followup_v2.sh
# and `apply_capacity_tuning.sh --only fingerprint` (existing nodes).
#
# 3proxy terminates TCP, so a target always sees THIS kernel's SYN. These are
# the stock Ubuntu 24.04 / kernel 6.8 values — a coherent modern-Linux SYN on
# every node (TTL/hop limit 64, MSS 1460/1440 from MTU 1500, SACK, timestamps,
# window scaling 7, window 64240) — pinned so that every node sends the same one,
# whatever a future kernel or a stray tuning script changes.
#
# The name sorts AFTER 99-sysctl.conf (Ubuntu's link to /etc/sysctl.conf), so a
# leftover line there — the old generator wrote tcp_timestamps = 0,
# tcp_rmem = "4096 87380 6291456" and min_adv_mss = 1460 into /etc/sysctl.conf —
# no longer wins at boot.
#
# Do NOT emulate another OS here: TTL 128 or timestamps off only produce the
# incoherent Linux-TTL/Windows-options mix that classifiers flag as a VPN
# (incident 2026-05-23). No MSS clamp either: the kernel derives MSS from the
# MTU; nft `maxseg size set` can only lower it (1340 read as OpenVPN).
# IPv6 hop limit: the interface's (64; a router advertisement may set it) —
# verify with `sysctl net.ipv6.conf.<if>.hop_limit`.
net.ipv4.ip_default_ttl = 64
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_ecn = 2
net.ipv4.tcp_rmem = 4096 131072 6291456
net.ipv4.route.min_adv_mss = 256
# PLPMTUD on a detected black hole (replaces the old fixed MSS clamp); not
# visible in the SYN.
net.ipv4.tcp_mtu_probing = 1
