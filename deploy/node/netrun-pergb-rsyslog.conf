# NETRUN pay-per-GB v2 — the per-GB haproxy's access log (log-tag
# netrun-pergb-haproxy, facility local1) goes to its own file on the per-GB
# log filesystem, and nowhere else (installed by deploy/node/install_pergb.sh
# as /etc/rsyslog.d/30-netrun-pergb-haproxy.conf: before the distribution's
# 49-haproxy.conf). rsyslog runs as syslog: the directory is 0751 and the file
# is pre-created owned by syslog.
if $programname == 'netrun-pergb-haproxy' then {
  action(type="omfile" file="/var/log/netrun-pergb/haproxy.log")
  stop
}
